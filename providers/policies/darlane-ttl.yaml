---
# Darlane TTL auto-scale-down enforcement
#
# Applies to: all namespaces — targets Deployments with label
#             app.kubernetes.io/component=devspace and annotation
#             wxops.cloud/darlane-ttl set.
#
# Requires: Kyverno v1.11+ (CleanupPolicy GA in Kyverno v1.12+)
#
# Install Kyverno:
#   helm repo add kyverno https://kyverno.github.io/kyverno/
#   helm install kyverno kyverno/kyverno -n kyverno --create-namespace
#
# Apply this file:
#   kubectl apply -f providers/policies/darlane-ttl.yaml
#
# How it interacts with Crossplane:
#   The darlane Deployment is Crossplane-managed. Kyverno deletes the
#   Deployment when TTL expires. provider-kubernetes detects the missing
#   resource and re-creates it from the Composition, which reads
#   darlane.replicas from the XTenantApp XR (default: 0). The net
#   effect is scale-to-zero as long as darlane.replicas is 0 in the XR.
#
#   If the portal manages darlane.replicas in the XR (sets it to 1 when
#   enabling Darlane), the portal must also reset it to 0 after TTL —
#   Kyverno alone cannot patch the XR. This policy is the safety net for
#   forgotten sessions where a developer scaled up via kubectl directly.

# ── Policy 1: Pre-expiry warning annotation ───────────────────────────────
# Adds wxops.cloud/darlane-ttl-warning=expiring-soon 30 min before expiry.
# Useful for the portal to surface a "Darlane expiring in 30 min" banner.
apiVersion: kyverno.io/v2
kind: ClusterPolicy
metadata:
  name: darlane-ttl-warning
  annotations:
    policies.kyverno.io/title: Darlane TTL expiry warning
    policies.kyverno.io/description: >
      Adds wxops.cloud/darlane-ttl-warning=expiring-soon to darlane Deployments
      when fewer than 30 minutes remain before the TTL expires. The portal can
      watch this annotation to surface a warning banner without waiting for cleanup.
spec:
  background: true
  rules:
    - name: annotate-expiring-devspace
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  app.kubernetes.io/component: devspace
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations[\"wxops.cloud/darlane-ttl\"] | length(@) }}"
            operator: GreaterThan
            value: "0"
          # Warning window: TTL - 30m < now < TTL (expiry not yet reached)
          - key: "{{ time_after(time_now_utc(), time_add(request.object.metadata.creationTimestamp, request.object.metadata.annotations[\"wxops.cloud/darlane-ttl\"])) }}"
            operator: NotEquals
            value: "true"
          - key: "{{ time_after(time_now_utc(), time_add(time_add(request.object.metadata.creationTimestamp, request.object.metadata.annotations[\"wxops.cloud/darlane-ttl\"]), '-30m')) }}"
            operator: Equals
            value: "true"
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              wxops.cloud/darlane-ttl-warning: expiring-soon

---
# ── Policy 2: Expired Darlane cleanup ───────────────────────────────────
# Deletes darlane Deployments when creationTimestamp + darlane-ttl < now.
# Crossplane re-creates the Deployment from the Composition at replicas=0
# (the XR default), achieving auto-scale-down.
#
# Schedule: every 30 minutes. Adjust as needed — shorter schedules increase
# Kyverno load; longer schedules delay enforcement past the TTL window.
apiVersion: kyverno.io/v2alpha1
kind: ClusterCleanupPolicy
metadata:
  name: darlane-ttl-scaledown
  annotations:
    policies.kyverno.io/title: Darlane TTL scale-down
    policies.kyverno.io/description: >
      Deletes darlane Deployments whose TTL (wxops.cloud/darlane-ttl annotation)
      has expired. Crossplane provider-kubernetes re-creates the Deployment from
      the XTenantApp Composition at darlane.replicas=0 (XR default), completing
      the scale-down. Runs every 30 minutes.
spec:
  schedule: "*/30 * * * *"
  match:
    any:
      - resources:
          kinds:
            - Deployment
          selector:
            matchLabels:
              app.kubernetes.io/component: devspace
  conditions:
    all:
      # Must have a TTL annotation
      - key: "{{ request.object.metadata.annotations[\"wxops.cloud/darlane-ttl\"] | length(@) }}"
        operator: GreaterThan
        value: "0"
      # creationTimestamp + TTL duration < now  →  TTL expired
      - key: "{{ time_after(time_now_utc(), time_add(request.object.metadata.creationTimestamp, request.object.metadata.annotations[\"wxops.cloud/darlane-ttl\"])) }}"
        operator: Equals
        value: "true"
