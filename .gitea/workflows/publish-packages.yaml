name: Publish Crossplane Packages

on:
  push:
    tags:
      - "v*"

env:
  # Override via repository variable: Settings → Variables → REGISTRY
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version

      - name: Run package validation
        run: bash scripts/validate-packages.sh

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        package:
          - gitea-user
          - gitea-org
          - gitea-team
          - gitea-repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build package
        run: |
          crossplane xpkg build \
            -f package/${{ matrix.package }} \
            -o platform-wxops-${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push versioned tag
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:${{ github.ref_name }} \
            -f platform-wxops-${{ matrix.package }}.xpkg

      - name: Push latest tag
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:latest \
            -f platform-wxops-${{ matrix.package }}.xpkg

  update-configurations:
    name: Update configuration.yaml versions
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Update spec.package to new version
        env:
          VERSION: ${{ github.ref_name }}
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}
        run: |
          for pkg in gitea-user gitea-org gitea-team gitea-repository; do
            sed -i \
              "s|package: .*/platform-wxops-${pkg}:.*|package: ${REGISTRY}/platform-wxops-${pkg}:${VERSION}|" \
              package/install/${pkg}.yaml
          done

      - name: Update VERSIONS.yaml package versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for pkg in gitea-user gitea-org gitea-team gitea-repository; do
            sed -i \
              "/^  ${pkg}:/,/^  [a-z]/ s|current: .*|current: ${VERSION}|" \
              VERSIONS.yaml
          done

      - name: Commit and push updated files
        run: |
          git config user.name  "W'xOps Platform Bot"
          git config user.email "wxopsbot@wxops.cloud"
          git add package/install/ VERSIONS.yaml
          git diff --staged --quiet || \
            git commit -m "chore: bump package images to ${{ github.ref_name }}"
          git push origin HEAD:main
