name: Publish Crossplane Packages

on:
  push:
    tags:
      - "v*"

env:
  # Override via repository variable: Settings → Variables → REGISTRY
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          # Prevent error when require kubeconfig for server side validation
          crossplane version --client

      - name: Run package validation
        run: bash scripts/validate-packages.sh

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        package:
          - gitea-user
          - gitea-org
          - gitea-team
          - gitea-repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          # Prevent error when require kubeconfig for server side validation
          crossplane version --client

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build package
        run: |
          crossplane xpkg build \
            -f package/${{ matrix.package }} \
            -o platform-wxops-${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push versioned tag
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:${{ github.ref_name }} \
            -f platform-wxops-${{ matrix.package }}.xpkg

      - name: Push latest tag
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:latest \
            -f platform-wxops-${{ matrix.package }}.xpkg

  create-release:
    name: Create Gitea release
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: pip install git-cliff

      - name: Build release body
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Generate the changelog section for this tag only
          git-cliff --current --strip all > /tmp/cliff-section.md

          # Combine custom release notes (if present) with the cliff section
          notes_file="release-notes/${VERSION}.md"
          if [ -f "$notes_file" ]; then
            cat "$notes_file" > /tmp/release-body.md
            echo "" >> /tmp/release-body.md
            echo "---" >> /tmp/release-body.md
            echo "" >> /tmp/release-body.md
          fi
          cat /tmp/cliff-section.md >> /tmp/release-body.md

      - name: Create Gitea release
        env:
          VERSION: ${{ github.ref_name }}
          GITEA_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          GITEA_HOST: gitea.xeusnguyen.xyz
          GITEA_REPO: platform-team/wxops-core
        run: |
          body=$(cat /tmp/release-body.md)
          curl -sS -X POST "https://${GITEA_HOST}/api/v1/repos/${GITEA_REPO}/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag  "$VERSION" \
              --arg name "Release ${VERSION}" \
              --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"

  update-configurations:
    name: Update install manifest versions
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Update spec.package to new version
        env:
          VERSION: ${{ github.ref_name }}
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}
        run: |
          for pkg in gitea-user gitea-org gitea-team gitea-repository; do
            sed -i \
              "s|package: .*/platform-wxops-${pkg}:.*|package: ${REGISTRY}/platform-wxops-${pkg}:${VERSION}|" \
              package/install/${pkg}.yaml
          done

      - name: Update VERSIONS.yaml package versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for pkg in gitea-user gitea-org gitea-team gitea-repository; do
            sed -i \
              "/^  ${pkg}:/,/^  [a-z]/ s|current: .*|current: ${VERSION}|" \
              VERSIONS.yaml
          done

      - name: Commit and push updated files
        run: |
          git config user.name  "W'xOps Platform Bot"
          git config user.email "wxopsbot@wxops.cloud"
          git add package/install/ VERSIONS.yaml
          git diff --staged --quiet || \
            git commit -m "chore: bump package images to ${{ github.ref_name }}"
          git push origin HEAD:main
