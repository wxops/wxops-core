name: Publish Crossplane Packages

on:
  push:
    tags:
      - "v*"

env:
  # Override via repository variable: Settings → Variables → REGISTRY
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          # Prevent error when require kubeconfig for server side validation
          crossplane version --client

      - name: Run package validation
        run: bash .gitea/scripts/validate-packages.sh

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        package:
          - gitea-user
          - gitea-org
          - gitea-team
          - gitea-repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          # Prevent error when require kubeconfig for server side validation
          crossplane version --client

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve package version from VERSIONS.yaml
        id: pkg-version
        env:
          PKG: ${{ matrix.package }}
        run: |
          pkg_ver=$(python3 -c "import yaml,os; d=yaml.safe_load(open('VERSIONS.yaml')); print(d['packages'][os.environ['PKG']]['package']['current'])")
          echo "value=${pkg_ver}" >> $GITHUB_OUTPUT

      - name: Check if version changed since last release
        id: changed
        env:
          PKG: ${{ matrix.package }}
          CURR_VER: ${{ steps.pkg-version.outputs.value }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$prev_tag" ]; then
            echo "→ ${PKG}: no previous tag — building"
            echo "value=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          prev_ver=$(git show "${prev_tag}:VERSIONS.yaml" | \
            python3 -c "import yaml,os,sys; d=yaml.safe_load(sys.stdin); print(d.get('packages',{}).get(os.environ['PKG'],{}).get('package',{}).get('current',''))")
          if [ "$prev_ver" = "$CURR_VER" ]; then
            echo "→ ${PKG}: unchanged at ${CURR_VER} — skipping"
            echo "value=false" >> $GITHUB_OUTPUT
          else
            echo "→ ${PKG}: ${prev_ver} → ${CURR_VER}"
            echo "value=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg build \
            -f package/${{ matrix.package }} \
            -o platform-wxops-${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push versioned tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:${{ steps.pkg-version.outputs.value }} \
            -f platform-wxops-${{ matrix.package }}.xpkg

      - name: Push latest tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:latest \
            -f platform-wxops-${{ matrix.package }}.xpkg

  create-release:
    name: Create Gitea release
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: pip install git-cliff --break-system-packages

      - name: Build release body
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes_file="release-notes/${VERSION}.md"
          base="${notes_file}"
          if [ ! -f "$base" ]; then
            base="release-notes/template.md"
          fi
          { cat "$base"; printf '\n---\n\n'; } > /tmp/release-body.md
          git-cliff --current --strip all >> /tmp/release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

  update-configurations:
    name: Update install manifest versions
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Sync install manifests from VERSIONS.yaml
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io/wxops' }}
        run: |
          for pkg in gitea-user gitea-org gitea-team gitea-repository; do
            pkg_ver=$(PKG="$pkg" python3 -c "import yaml,os; d=yaml.safe_load(open('VERSIONS.yaml')); print(d['packages'][os.environ['PKG']]['package']['current'])")
            sed -i \
              "s|package: .*/platform-wxops-${pkg}:.*|package: ${REGISTRY}/platform-wxops-${pkg}:${pkg_ver}|" \
              package/install/${pkg}.yaml
          done

      - name: Commit and push updated files
        run: |
          git config user.name  "W'xOps Platform Bot"
          git config user.email "wxopsbot@wxops.cloud"
          git add package/install/
          git diff --staged --quiet || \
            git commit -m "chore: bump package images"
          git push origin HEAD:main
