# cliff.toml — git-cliff configuration for W'xOps Core
#
# Usage:
#   git-cliff -o CHANGELOG.md          # write to file
#   git-cliff                          # print to stdout (preview)
#   git-cliff --tag v0.2.0             # preview changelog for a new tag
#
# Install: cargo install git-cliff   OR   pip install git-cliff

[changelog]
header = """
# Changelog

All notable changes to W'xOps Core packages are documented here.

Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Commit messages follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

> This file is regenerated from git history by running `make changelog`.
> Do not edit it manually.

---

## XRD API version matrix

| Package | v1alpha1 | v1beta1 | v1 |
|---|---|---|---|
| gitea-user | ✓ introduced `v0.1.0` | — | — |
| gitea-org | ✓ introduced `v0.1.0` | — | — |
| gitea-team | ✓ introduced `v0.1.0` | — | — |
| gitea-repository | ✓ introduced `v0.1.0` | — | — |

Legend: ✓ = served and storage · (d) = deprecated, served only · — = not defined

---
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))
{% endfor %}
{% endfor %}
"""

footer = """
---
{% for release in releases %}\
{% if release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://gitea.xeusnguyen.xyz/platform-team/wxops-core/releases/tag/{{ release.version }}
{% endif %}\
{% endfor %}\
{% set latest = releases | filter(attribute="version") | first %}\
{% if latest %}\
[Unreleased]: https://gitea.xeusnguyen.xyz/platform-team/wxops-core/compare/{{ latest.version }}...HEAD
{% endif %}\
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []

# Map conventional commit types to changelog section headings.
commit_parsers = [
  { message = "^feat\\((.*)\\)!",   group = "Breaking Changes" },
  { message = "^fix\\((.*)\\)!",    group = "Breaking Changes" },
  { message = "^feat",              group = "Features" },
  { message = "^fix",               group = "Bug Fixes" },
  { message = "^perf",              group = "Performance" },
  { message = "^refactor",          group = "Refactor" },
  { message = "^docs",              group = "Documentation" },
  { message = "^test",              group = "Testing" },
  { message = "^chore\\(ci\\)",                  group = "CI/CD" },
  { message = "^chore: bump package images", skip = true },
  { message = "^chore",                         group = "Chores" },
  { message = "^revert",                        group = "Reverts" },
]

# Package-level scopes — these keep per-package history filterable.
# Valid scopes: gitea-user, gitea-org, gitea-team, gitea-repository,
#               random-password, ci, providers, docs
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
