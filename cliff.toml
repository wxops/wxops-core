# cliff.toml — git-cliff configuration for W'xOps Core
#
# Usage:
#   git-cliff -o CHANGELOG.md          # write to file
#   git-cliff                          # print to stdout (preview)
#   git-cliff --tag v0.2.0             # preview changelog for a new tag
#
# Install: cargo install git-cliff   OR   pip install git-cliff

[changelog]
header = """
# Changelog

All notable changes to W'xOps Core packages are documented here.

Format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versioning follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Commit messages follow [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

> This file is regenerated from git history by running `make changelog`.
> Do not edit it manually.

> Each release below links to a tag-pinned snapshot of [`docs/`](docs/)
> (API reference) and [`VERSIONS.yaml`](VERSIONS.yaml) as they existed at
> that tag — not the current `main`. Follow the links in-repo for the
> latest state.

---
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️ **BREAKING**{% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))
{% endfor %}
{% endfor %}
{% if version %}
📖 [API reference](https://gitea.xeusnguyen.xyz/platform-team/wxops-core/src/tag/{{ version }}/docs) · [`VERSIONS.yaml`](https://gitea.xeusnguyen.xyz/platform-team/wxops-core/src/tag/{{ version }}/VERSIONS.yaml)
{% if previous and previous.version %}\
{% set cur = version | trim_start_matches(pat="v") | split(pat=".") %}\
{% set prev = previous.version | trim_start_matches(pat="v") | split(pat=".") %}\
🔍 [Diff vs {{ previous.version | trim_start_matches(pat="v") }}](https://gitea.xeusnguyen.xyz/platform-team/wxops-core/compare/{{ previous.version }}...{{ version }})
{% if cur.0 != prev.0 or cur.1 != prev.1 %}

> ⚠️ **API version bump ({{ previous.version | trim_start_matches(pat="v") }} → {{ version | trim_start_matches(pat="v") }})** — major/minor change usually means a new or
> changed XRD API version (`spec.versions[]`). Check the diff above and
> [`VERSIONS.yaml`](https://gitea.xeusnguyen.xyz/platform-team/wxops-core/src/tag/{{ version }}/VERSIONS.yaml)
> for affected packages, and [`docs/`](https://gitea.xeusnguyen.xyz/platform-team/wxops-core/src/tag/{{ version }}/docs)
> for schema changes.
{% endif %}\
{% endif %}\
{% endif %}\
"""

footer = """
---
{% for release in releases %}\
{% if release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: \
https://gitea.xeusnguyen.xyz/platform-team/wxops-core/releases/tag/{{ release.version }}
{% endif %}\
{% endfor %}\
{% set latest = releases | filter(attribute="version") | first %}\
{% if latest %}\
[Unreleased]: https://gitea.xeusnguyen.xyz/platform-team/wxops-core/compare/{{ latest.version }}...HEAD
{% endif %}\
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []

# Map conventional commit types to changelog section headings.
commit_parsers = [
  { message = "^feat\\((.*)\\)!",   group = "Breaking Changes" },
  { message = "^fix\\((.*)\\)!",    group = "Breaking Changes" },
  { message = "^feat",              group = "Features" },
  { message = "^fix",               group = "Bug Fixes" },
  { message = "^perf",              group = "Performance" },
  { message = "^refactor",          group = "Refactor" },
  { message = "^docs",              group = "Documentation" },
  { message = "^test",              group = "Testing" },
  { message = "^chore\\(ci\\)",                  group = "CI/CD" },
  { message = "^chore: bump package images", skip = true },
  { message = "^chore\\(release\\): ",          skip = true },
  { message = "^chore",                         group = "Chores" },
  { message = "^revert",                        group = "Reverts" },
]

# Package-level scopes — these keep per-package history filterable.
# Valid scopes: gitea-user, gitea-org, gitea-team, gitea-repository,
#               random-password, ci, providers, docs
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
