# VERSIONS.yaml — single source of truth for package and XRD API versions.
#
# Two axes:
#   package  — OCI image version in the registry (bumped on every git tag)
#   api      — Kubernetes XRD API version(s) served by this package
#
# Rules:
#   • Never remove an entry from api.served — that is a breaking change.
#   • Adding a new api.served version → bump package minor (x.Y.0).
#   • Schema change within a version (backward-compat) → bump package patch (x.y.Z).
#   • Breaking schema change → add a new api version first, then bump package major.
#
# Updated automatically by CI on tag push (package.current).
# Updated manually when XRD spec.versions changes (api.*).
#
# API version decision (ROADMAP.md Phase 0 §0.5, decided): all seven XRDs stay
# on v1alpha1 through the portal's first integration. Every Phase 0 change
# (status parity, monitoring, targetCluster, darlane status) is purely
# additive, so nothing forces a bump — dual-serving now would duplicate the
# full schema per XRD (500+ lines for tenant-app alone) for no present benefit.
# Promote to v1beta1 as part of Phase 4 (OSS release), the natural point to
# make a stability commitment. Portal v1 pinning an alpha API is acceptable
# while portal and core ship together. See docs/status-contract.md for the
# current per-package status field contract the portal binds to today.

packages:

  gitea-user:
    package:
      current: v0.1.2
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Manages a single Gitea user lifecycle (create / update / delete).

  gitea-org:
    package:
      current: v0.1.2
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Manages a Gitea organisation with visibility and metadata.

  gitea-team:
    package:
      current: v0.1.2
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Manages a team inside a Gitea organisation, including membership.

  gitea-repository:
    package:
      current: v0.1.1
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Manages a Gitea repository owned by an organisation.

  platform-database-clusters:
    package:
      current: v0.1.5
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Platform-managed CloudNativePG cluster with pooler, Vault credential seeding, and shared-cluster labeling for dynamic tenant pool discovery.

  tenant-database:
    package:
      current: v0.1.5
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Tenant-facing PostgreSQL database with dynamic tier resolution (shared pool auto-assign / dedicated cluster composition), Vault-backed credentials, and ESO sync.

  tenant-app:
    package:
      current: v0.2.5
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: |
      Tenant application scaffold (Deployment, Service, Traefik IngressRoute, Darlane debug-twin) with cert-manager TLS auto-provisioning,
      A/B traffic splitting via TraefikService, fileSync emptyDir overlay, multi-source volumes (PVC/ConfigMap/Secret), and oauth2-proxy SSO via Traefik middlewares

# Utility compositions — not yet published as standalone OCI packages.
utilities:

  random-password:
    api:
      served: [v1alpha1]
      storage: v1alpha1
    description: Generates a random password via the Terraform random provider.
