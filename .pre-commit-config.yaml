# .pre-commit-config.yaml
#
# Install (run both — they register different git hooks):
#   pip install pre-commit
#   pre-commit install                         # registers .git/hooks/pre-commit
#   pre-commit install --hook-type commit-msg  # registers .git/hooks/commit-msg
#
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate
#
# Hooks:
#   commit-msg  1. Conventional commit format enforcement
#   pre-commit  2. YAML style          (yamllint)
#               3. Kubernetes schema   (kubeconform)
#               4. Crossplane build    (crossplane xpkg build)
#               5. Package version bump (VERSIONS.yaml check)
#
# Allowed commit types (must stay in sync with cliff.toml commit_parsers):
#   feat | fix | perf | refactor | docs | test | chore | revert

default_stages: [pre-commit]

repos:
  # ── Conventional commit enforcement (commit-msg stage) ───────────────────────
  # Validates commit messages against the Conventional Commits spec.
  # Types mirror cliff.toml commit_parsers — adding a type here requires a
  # matching parser entry there so it appears in the changelog.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat    # new feature        → Features
          - fix     # bug fix            → Bug Fixes
          - perf    # performance        → Performance
          - refactor # code restructure  → Refactor
          - docs    # documentation      → Documentation
          - test    # tests              → Testing
          - chore   # maintenance        → Chores  (chore(ci) → CI/CD)
          - revert  # revert a commit    → Reverts

  # ── Standard file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.md$  # allow trailing whitespace in markdown files
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── YAML style ───────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        # Exclude generated or vendor-style files
        exclude: |
          (?x)^(
            \.git/.*
          )$

  # ── Kubernetes manifest validation ──────────────────────────────────────────
  # kubeconform validates manifests against published JSON schemas.
  # Runs as a local hook using the system-installed kubeconform binary.
  # Install: https://github.com/yannh/kubeconform#installation
  # --ignore-missing-schemas lets Crossplane-specific kinds (XRD, Composition,
  # Workspace, etc.) pass through without error — they are checked by the
  # crossplane-validate hook below.
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        language: system
        entry: kubeconform
        args:
          - -schema-location
          - default
          - -schema-location
          - "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          - -ignore-missing-schemas
          - -summary
          - -output
          - pretty
        files: \.(yaml|yml)$
        exclude: |
          (?x)^(
            examples/.*|
            kcl/.*|
            \.gitea/.*|
            VERSIONS\.yaml|
            CHANGELOG\.md|
            .pre-commit-config\.yaml|
            .yamllint\.yaml
          )$

  # ── Crossplane package build (render test) ───────────────────────────────────
  # Runs `crossplane xpkg build` for each package directory.
  # Builds to a temp location and cleans up — acts as a full render+lint pass.
  # Requires `crossplane` CLI on PATH (https://docs.crossplane.io/latest/cli/).
  - repo: local
    hooks:
      - id: crossplane-validate
        name: crossplane xpkg build (all packages)
        language: script
        entry: .gitea/scripts/validate-packages.sh
        pass_filenames: false
        files: ^package/
        types: [yaml]

  # ── KCL drift check ──────────────────────────────────────────────────────────
  # Ensures composition.yaml spec.source is in sync with kcl/{pkg}/main.k.
  # If you edit main.k, run `make kcl-sync` before committing.
  - repo: local
    hooks:
      - id: kcl-drift-check
        name: kcl source in sync with compositions
        language: python
        entry: python3 .gitea/scripts/kcl-sync.py --check
        pass_filenames: false
        files: ^(kcl/|package/(platform-database-clusters|tenant-database)/composition\.yaml)

  # ── Package version bump enforcement ─────────────────────────────────────────
  # Ensures VERSIONS.yaml carries a bumped version for every package whose YAML
  # files are staged. Reads VERSIONS.yaml from the index so the developer can
  # include the bump in the same commit as the package change.
  # NOTE: When adding a new package, you can add another after `|` in the regex, e.g: `| postgresql-cluster | redis-cluster | `.
  - repo: local
    hooks:
      - id: versions-bump-check
        name: ensure VERSIONS.yaml is bumped for changed packages
        language: script
        entry: .gitea/scripts/check-versions-bump.sh
        pass_filenames: false
        files: ^package/(gitea-user|gitea-org|gitea-team|gitea-repository|platform-database-clusters|tenant-database)/.*\.yaml$
