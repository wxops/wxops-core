name: Publish Crossplane Packages

# Through v0.4.0, Gitea was primary and GitHub received a deliberate push per
# release. From v0.5.0, GitHub is primary and Gitea is archived (frozen,
# read-only). This workflow fires on a tag pushed directly here.
#
# NOT YET DONE for the v0.5.0 cutover: this workflow still doesn't commit
# package/install/*.yaml or CHANGELOG.md bumps back to main — that job only
# exists on the Gitea side today, written for a Gitea-primary world where
# adding it here too would have raced it. Add it here before the first
# post-cutover release, or that release ships with a stale package/install/.
#
# One-time manual setup:
#   1. GitHub org "wxops": Settings → Packages → Package creation must permit
#      this repository to publish. ghcr.io/wxops/* only works with the default
#      GITHUB_TOKEN because this repo is itself owned by "wxops" — if that ever
#      changes, this needs a PAT instead.
#   2. First publish of each package: its ghcr.io package is created PRIVATE
#      by default even though this repo is public. Go to the package's
#      Settings → Change visibility → Public (or link it to this repository
#      and inherit visibility) once per package, after its first push.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io/wxops

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Run package validation
        run: bash .gitea/scripts/validate-packages.sh

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        package:
          - gitea-user
          - gitea-org
          - gitea-team
          - gitea-repository
          - platform-database-clusters
          - tenant-database
          - tenant-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve package version from VERSIONS.yaml
        id: pkg-version
        env:
          PKG: ${{ matrix.package }}
        run: |
          pkg_ver=$(sed -n "/^  ${PKG}:/,/^  [a-z]/p" VERSIONS.yaml | grep "current:" | awk '{print $2}')
          echo "value=${pkg_ver}" >> $GITHUB_OUTPUT

      # Same "skip unchanged packages" logic as the Gitea workflow. On the
      # mirror, `git describe` walks the mirrored tag history, which the push
      # mirror carries over — so this behaves identically to the Gitea side.
      - name: Check if version changed since last release
        id: changed
        env:
          PKG: ${{ matrix.package }}
          CURR_VER: ${{ steps.pkg-version.outputs.value }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$prev_tag" ]; then
            echo "→ ${PKG}: no previous tag — building"
            echo "value=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          prev_ver=$(git show "${prev_tag}:VERSIONS.yaml" 2>/dev/null | \
            sed -n "/^  ${PKG}:/,/^  [a-z]/p" | { grep "current:" || true; } | awk '{print $2}')
          if [ -z "$prev_ver" ]; then
            echo "→ ${PKG}: not present at ${prev_tag} — first release, building"
            echo "value=true" >> $GITHUB_OUTPUT
          elif [ "$prev_ver" = "$CURR_VER" ]; then
            echo "→ ${PKG}: unchanged at ${CURR_VER} — skipping"
            echo "value=false" >> $GITHUB_OUTPUT
          else
            echo "→ ${PKG}: ${prev_ver} → ${CURR_VER}"
            echo "value=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg build \
            -f package/${{ matrix.package }} \
            -o platform-wxops-${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push versioned tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:${{ steps.pkg-version.outputs.value }} \
            -f platform-wxops-${{ matrix.package }}.xpkg

      - name: Push latest tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/platform-wxops-${{ matrix.package }}:latest \
            -f platform-wxops-${{ matrix.package }}.xpkg

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: pip install git-cliff --break-system-packages

      - name: Build release body
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes_file="release-notes/${VERSION}.md"
          base="${notes_file}"
          if [ ! -f "$base" ]; then
            base="release-notes/template.md"
          fi
          { cat "$base"; printf '\n---\n\n'; } > /tmp/release-body.md
          git-cliff --current --strip all >> /tmp/release-body.md

      # No custom PAT — GITHUB_TOKEN is sufficient for a release on this same
      # repository, and cliff.toml's links already point at github.com/wxops.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
