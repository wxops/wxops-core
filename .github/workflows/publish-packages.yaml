name: Publish Crossplane Packages

# Fires on a release tag — release-YYYY-MM-DD[.N], cut by `make release`.
#
# The release commit is the whole truth. `make release` has already gated the
# change through tests/api_compat.py, decided which packages changed, pinned
# them in VERSIONS.yaml and package/install/, and regenerated CHANGELOG.md. This
# workflow only builds what that commit says: a package is rebuilt when its
# VERSIONS.yaml `current` equals the pushed tag. Nothing commits back to main —
# a bot rewriting package/install/ after the tag is how commit f22f0d7 put every
# manifest back on the Gitea registry.
#
# GitHub is primary from the first date-named release. Gitea is archived and no
# longer publishes; its publish workflow was removed.
#
# One-time manual setup:
#   1. GitHub org "wxops": Settings → Packages → Package creation must permit
#      this repository to publish. ghcr.io/wxops/* only works with the default
#      GITHUB_TOKEN because this repo is itself owned by "wxops" — if that ever
#      changes, this needs a PAT instead.
#   2. First publish of each package: its ghcr.io package is created PRIVATE
#      by default even though this repo is public. Go to the package's
#      Settings → Change visibility → Public (or link it to this repository
#      and inherit visibility) once per package, after its first push.

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io/wxops/wxops-core

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Run package validation
        run: bash .gitea/scripts/validate-packages.sh

  build-push:
    name: Build and push ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        package:
          - gitea-user
          - gitea-org
          - gitea-team
          - gitea-repository
          - platform-database-clusters
          - tenant-database
          - tenant-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No change detection here — `make release` did it and wrote the answer
      # into VERSIONS.yaml. Recomputing it would be a second source of truth.
      - name: Is this package in the release?
        id: changed
        env:
          PKG: ${{ matrix.package }}
          TAG: ${{ github.ref_name }}
        run: |
          current=$(sed -n "/^  ${PKG}:/,/^  [a-z]/p" VERSIONS.yaml | grep "current:" | awk '{print $2}')
          if [ "$current" = "$TAG" ]; then
            echo "→ ${PKG}: pinned to ${TAG} — building"
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ ${PKG}: unchanged, last changed in ${current} — skipping"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg build \
            -f package/${{ matrix.package }} \
            -o ${{ matrix.package }}.xpkg \
            --ignore kustomization.yaml

      - name: Push release tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/${{ matrix.package }}:${{ github.ref_name }} \
            -f ${{ matrix.package }}.xpkg

      - name: Push latest tag
        if: steps.changed.outputs.value == 'true'
        run: |
          crossplane xpkg push \
            ${{ env.REGISTRY }}/${{ matrix.package }}:latest \
            -f ${{ matrix.package }}.xpkg

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      # Full history: the package table measures changes against the previous
      # release tag, and git-cliff needs the tags to find this release's commits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install --quiet git-cliff -r tests/requirements.txt

      - name: Build release body
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body=/tmp/release-body.md
          : > "$body"
          # Optional for a `safe` release; `make release` refused to tag
          # anything else without it.
          if [ -f "release-notes/${TAG}.md" ]; then
            { cat "release-notes/${TAG}.md"; printf '\n---\n\n'; } >> "$body"
          fi
          {
            printf '## Packages\n\n'
            python3 .gitea/scripts/release-state.py summary "$TAG"
            printf '\n---\n\n'
          } >> "$body"
          git-cliff --current --strip all >> "$body"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "W'xOps Core ${{ github.ref_name }}"
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
