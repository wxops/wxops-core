# Production install — pulls each Configuration package from the OCI registry.
# Crossplane resolves and installs the XRDs and Compositions automatically.
#
# Usage:
#   kubectl apply -k package/install/
#
# Pins are written by `make release` (.gitea/scripts/release-state.py), never by
# hand: each package points at the release it last changed in, on ghcr.io/wxops.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gitea-user.yaml
  - gitea-org.yaml
  - gitea-team.yaml
  - gitea-repository.yaml
  - platform-database-clusters.yaml
  - tenant-database.yaml
  - tenant-app.yaml
