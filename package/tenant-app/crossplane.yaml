    meta.crossplane.io/description: Tenant application scaffold (Deployment, Service, Ingress, optional devSpace) with secretsFrom wiring, cert-manager TLS, and oauth2-proxy SSO.
    meta.crossplane.io/source: github.com/wxops/wxops-core
    meta.crossplane.io/license: Apache-2.0
