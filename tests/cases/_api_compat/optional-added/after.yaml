# expect: safe property-added
#
# An optional spec field and a new status field — the everyday additive change.
# The `minimum` lives inside the new field, so it constrains nothing that exists.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xwidgets.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Namespaced
  names:
    kind: XWidget
    plural: xwidgets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    replicas:
                      type: integer
                      minimum: 1
            status:
              type: object
              properties:
                ready:
                  type: boolean
                url:
                  type: string
