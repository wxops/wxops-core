# expect: safe property-added
#
# `monitoring` is a new optional block with its own required `port`. No existing
# XR sets `monitoring`, so nothing already stored can fail — the same shape the
# v0.4.0 monitoring block used. Must not be reported as breaking.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xwidgets.platform.wxops.cloud
spec:
  group: platform.wxops.cloud
  scope: Namespaced
  names:
    kind: XWidget
    plural: xwidgets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    monitoring:
                      type: object
                      required:
                        - port
                      properties:
                        port:
                          type: integer
